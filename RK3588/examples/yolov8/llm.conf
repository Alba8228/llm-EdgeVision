# ============================================================
# 板端统一配置 (rknn_yolov8_stream 与 rknn_udp_uart 共用本文件)
# 格式: key=value, # 注释; 程序按工作目录读 ./llm.conf
# ============================================================

# ---------- LLM 场景问答 ----------
api_key=xxx
model=deepseek-flash
port=12346
jpeg_quality=80
timeout_s=30
max_new_tokens=128

# ---------- 检测+推流 (原命令行参数) ----------
model_path=model/best.rknn
camera=/dev/video-camera0
width=1280
height=720
fps=30
# save_path=out.mp4        # 可选: 录制 mp4, 注释=不录
# push 支持两种: 纯数字端口(MJPEG-over-HTTP) 或 rtmp://地址
push=8080
calib=camera_calib.yaml   # 相机标定yaml, 注释/留空=不矫正

# ---------- UDP<->UART 车控转发 (rknn_udp_uart) ----------
uart_dev=/dev/ttyS1
uart_baud=115200
udp_port=12345
